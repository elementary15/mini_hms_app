{% extends "base.html" %}
{% block content %}
<div class="card" style="
    max-width: 420px;
    margin: 80px auto;
">
    <h2>Login</h2>
    <p class="muted">Access your account</p>

    <form method="post">
        {% csrf_token %}

        <label>Username</label><br>
        {{ form.username }}<br><br>

        <label>Password</label><br>
        {{ form.password }}<br><br>

        <button class="button" type="submit" style="width: 100%;">
            Login
        </button>
    </form>

    <br>
    <p class="muted">
        Don’t have an account?
        <a href="/signup/">Sign up</a>
    </p>
</div>
{% endblock %}
